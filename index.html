<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <meta name="description" content="寓見 MeetU——七位住戶，各自守著一扇通往故事的門。">
    <title>寓見 MeetU</title>
    <style>
        @font-face {
            font-family: "GenWan";
            src: url("./assets/fonts/genwan-regular.woff") format("woff");
            font-style: normal;
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: "GenWan";
            src: url("./assets/fonts/genwan-semibold.woff") format("woff");
            font-style: normal;
            font-weight: 600;
            font-display: swap;
        }

        :root {
            color-scheme: dark;
            --bg-deep: #050505;
            --bg-panel: #0b0b0b;
            --bg-raised: #121212;
            --text-main: #eceae5;
            --text-muted: #8b8983;
            --accent-gold: #c2b8a3;
            --accent-faint: rgba(194, 184, 163, 0.16);
            --line: rgba(255, 255, 255, 0.13);
            --line-strong: rgba(194, 184, 163, 0.38);
            --ease-cinema: cubic-bezier(0.25, 1, 0.5, 1);
            --font-serif: "GenWan", "Noto Serif TC", "Songti TC", serif;
            --font-sans: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--bg-deep);
            scroll-behavior: smooth;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 50% -20%, rgba(194, 184, 163, 0.08), transparent 42%),
                var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-serif);
        }

        body.modal-open {
            overflow: hidden;
        }

        button,
        input {
            font: inherit;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        [hidden] {
            display: none !important;
        }

        .film-grain {
            position: fixed;
            z-index: 200;
            inset: 0;
            pointer-events: none;
            opacity: 0.1;
            mix-blend-mode: overlay;
            background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyBAMAAADsEZWCAAAAGFBMVEUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/cOM2AAAACHRSTlMAMwA0ADMAMwD/J/EAAAAySURBVDjLY2AYBaNgFIyCUcDAwMAQEBDAwMTEtWrVqjWMR2HWAQyDBQYnBgwzWDBiAAQAhJ4Jj6zD/QAAAABJRU5ErkJggg==");
            background-size: 80px 80px;
        }

        .audio-controls {
            position: fixed;
            z-index: 150;
            top: 30px;
            right: clamp(20px, 4vw, 64px);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .track-name {
            color: rgba(255, 255, 255, 0.28);
            font-family: var(--font-sans);
            font-size: 0.68rem;
            font-weight: 300;
            letter-spacing: 0.18em;
            transition: color 300ms ease;
        }

        .sound-toggle {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            min-height: 36px;
            padding: 6px 0;
            border: 0;
            color: rgba(255, 255, 255, 0.42);
            background: transparent;
            font-family: var(--font-sans);
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: color 300ms ease;
        }

        .sound-toggle:hover,
        .sound-toggle:focus-visible,
        .sound-toggle[aria-pressed="true"] {
            color: var(--accent-gold);
            outline: none;
        }

        .sound-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 0 0 rgba(194, 184, 163, 0.35);
        }

        .sound-toggle[aria-pressed="true"] .sound-dot {
            animation: sound-pulse 1.8s ease-out infinite;
        }

        @keyframes sound-pulse {
            60%, 100% { box-shadow: 0 0 0 9px rgba(194, 184, 163, 0); }
        }

        .site-header {
            position: relative;
            z-index: 10;
            padding: clamp(80px, 10vh, 120px) 6vw clamp(28px, 4vh, 52px);
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 18px;
            color: rgba(194, 184, 163, 0.56);
            font-family: var(--font-sans);
            font-size: 0.62rem;
            font-weight: 400;
            letter-spacing: 0.5em;
            text-transform: uppercase;
        }

        .main-title {
            margin: 0 0 20px;
            color: rgba(255, 255, 255, 0.96);
            font-size: clamp(2.4rem, 4vw, 3.4rem);
            font-weight: 600;
            letter-spacing: 0.74em;
            line-height: 1.2;
            text-indent: 0.74em;
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.85);
        }

        .sub-title {
            max-width: 720px;
            margin: 0 auto;
            color: var(--text-muted);
            font-size: clamp(0.76rem, 1.2vw, 0.88rem);
            font-weight: 300;
            letter-spacing: 0.32em;
            line-height: 2.35;
        }

        .common-room-button {
            display: inline-flex;
            min-height: 48px;
            margin-top: 28px;
            padding: 0 24px;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(194, 184, 163, 0.28);
            color: rgba(255, 255, 255, 0.72);
            background: rgba(194, 184, 163, 0.035);
            font-family: var(--font-sans);
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.28em;
            cursor: pointer;
            transition:
                border-color 300ms ease,
                color 300ms ease,
                background 300ms ease,
                transform 500ms var(--ease-cinema);
        }

        .common-room-button:hover,
        .common-room-button:focus-visible {
            border-color: var(--line-strong);
            color: #fff;
            background: var(--accent-faint);
            outline: none;
            transform: translateY(-2px) scale(1.015);
        }

        .corridor {
            position: relative;
            z-index: 10;
            width: min(94vw, 1800px);
            margin: 0 auto;
            padding-bottom: clamp(52px, 8vh, 92px);
        }

        .apartment-grid {
            display: flex;
            gap: 4px;
            width: 100%;
            height: clamp(540px, 70vh, 760px);
            overflow-x: auto;
            overflow-y: hidden;
            overscroll-behavior-x: contain;
            scroll-behavior: smooth;
            scroll-snap-type: x proximity;
            scrollbar-width: none;
        }

        .apartment-grid::-webkit-scrollbar {
            display: none;
        }

        .room {
            position: relative;
            isolation: isolate;
            flex: 1 0 clamp(124px, 13vw, 218px);
            min-width: 0;
            overflow: hidden;
            border: 0;
            background: var(--bg-raised);
            cursor: pointer;
            scroll-snap-align: center;
            transition: flex-basis 700ms var(--ease-cinema), filter 400ms ease;
        }

        .room::after {
            content: "";
            position: absolute;
            z-index: 3;
            inset: 0;
            border: 1px solid transparent;
            pointer-events: none;
            transition: border-color 450ms ease;
        }

        .room:hover,
        .room:focus-visible {
            flex-basis: clamp(320px, 34vw, 560px);
            outline: none;
        }

        .room:hover::after,
        .room:focus-visible::after {
            border-color: rgba(194, 184, 163, 0.32);
        }

        .room-bg {
            position: absolute;
            z-index: -2;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(34%) brightness(0.31) contrast(1.08);
            transform: scale(1.005);
            transform-origin: var(--room-zoom-origin, 50% 50%);
            transition: filter 850ms var(--ease-cinema), transform 900ms var(--ease-cinema);
        }

        .room:hover .room-bg,
        .room:focus-visible .room-bg {
            filter: grayscale(10%) brightness(0.84) contrast(1.06);
            transform: scale(var(--room-hover-scale, 1.045));
        }

        .room-shade {
            position: absolute;
            z-index: -1;
            inset: 0;
            background:
                linear-gradient(to bottom, rgba(0, 0, 0, 0.3), transparent 30%),
                linear-gradient(to top, rgba(4, 4, 4, 0.97), rgba(4, 4, 4, 0.5) 38%, transparent 68%);
            opacity: 0.72;
            transition: opacity 600ms ease;
        }

        .room:hover .room-shade,
        .room:focus-visible .room-shade {
            opacity: 0.94;
        }

        .room-number {
            position: absolute;
            z-index: 4;
            top: 28px;
            left: 20px;
            margin: 0;
            color: rgba(255, 255, 255, 0.45);
            font-family: var(--font-sans);
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 0.34em;
            mix-blend-mode: difference;
            text-transform: uppercase;
            writing-mode: vertical-rl;
            transition: color 450ms ease;
        }

        .room:hover .room-number,
        .room:focus-visible .room-number {
            color: var(--accent-gold);
        }

        .room-content {
            position: absolute;
            z-index: 2;
            right: 0;
            bottom: 0;
            left: 0;
            padding: 38px 30px;
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 600ms ease 80ms, transform 700ms var(--ease-cinema) 80ms;
        }

        .room:hover .room-content,
        .room:focus-visible .room-content {
            opacity: 1;
            transform: translateY(0);
        }

        .char-name {
            width: fit-content;
            max-width: 100%;
            margin: 0 0 12px;
            padding-bottom: 9px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.24);
            color: #fff;
            font-size: clamp(1.25rem, 2vw, 1.55rem);
            font-weight: 600;
            letter-spacing: 0.22em;
            line-height: 1.5;
            white-space: nowrap;
        }

        .char-quote {
            max-width: 38em;
            margin: 0;
            color: rgba(255, 255, 255, 0.76);
            font-size: 0.79rem;
            font-style: italic;
            font-weight: 300;
            letter-spacing: 0.11em;
            line-height: 2.05;
        }

        .open-hint {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 18px;
            color: rgba(194, 184, 163, 0.58);
            font-family: var(--font-sans);
            font-size: 0.58rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
        }

        .open-hint::before {
            content: "";
            width: 24px;
            height: 1px;
            background: currentColor;
        }

        .corridor-nav {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding-top: 16px;
        }

        .nav-button {
            display: grid;
            width: 42px;
            height: 36px;
            padding: 0;
            place-items: center;
            border: 1px solid var(--line);
            color: rgba(255, 255, 255, 0.58);
            background: rgba(8, 8, 8, 0.72);
            cursor: pointer;
            transition: border-color 250ms ease, color 250ms ease, background 250ms ease;
        }

        .nav-button:hover,
        .nav-button:focus-visible {
            border-color: var(--line-strong);
            color: var(--accent-gold);
            background: rgba(194, 184, 163, 0.08);
            outline: none;
        }

        .nav-button:disabled {
            opacity: 0.25;
            cursor: default;
        }

        .resident-modal,
        .pin-layer {
            position: fixed;
            z-index: 300;
            inset: 0;
            display: grid;
            padding: clamp(18px, 5vw, 72px);
            place-items: center;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(16px);
            opacity: 0;
            transition: opacity 260ms ease;
        }

        .resident-modal.is-open,
        .pin-layer.is-open {
            opacity: 1;
        }

        .resident-card {
            position: relative;
            width: min(620px, 100%);
            padding: clamp(30px, 6vw, 58px);
            overflow: hidden;
            border: 1px solid rgba(194, 184, 163, 0.26);
            background:
                linear-gradient(135deg, rgba(194, 184, 163, 0.07), transparent 32%),
                rgba(9, 9, 9, 0.97);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.72);
            transform: translateY(12px) scale(0.985);
            transition: transform 350ms var(--ease-cinema);
        }

        .resident-modal.is-open .resident-card,
        .pin-layer.is-open .pin-card {
            transform: translateY(0) scale(1);
        }

        .resident-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: clamp(30px, 6vw, 58px);
            width: 62px;
            height: 2px;
            background: var(--accent-gold);
        }

        .close-button {
            position: absolute;
            top: 18px;
            right: 18px;
            display: grid;
            width: 38px;
            height: 38px;
            padding: 0;
            place-items: center;
            border: 0;
            color: rgba(255, 255, 255, 0.48);
            background: transparent;
            font-family: var(--font-sans);
            font-size: 1.35rem;
            font-weight: 300;
            cursor: pointer;
            transition: color 220ms ease, transform 220ms ease;
        }

        .close-button:hover,
        .close-button:focus-visible {
            color: var(--accent-gold);
            outline: none;
            transform: rotate(4deg);
        }

        .modal-room {
            margin: 0 0 18px;
            color: rgba(194, 184, 163, 0.58);
            font-family: var(--font-sans);
            font-size: 0.67rem;
            letter-spacing: 0.38em;
        }

        .modal-name {
            margin: 0;
            color: var(--text-main);
            font-size: clamp(1.25rem, 2vw, 1.55rem);
            font-weight: 600;
            letter-spacing: 0.22em;
            line-height: 1.5;
        }

        .modal-quote {
            margin: 24px 0 0;
            padding-left: 18px;
            border-left: 1px solid rgba(194, 184, 163, 0.38);
            color: rgba(255, 255, 255, 0.68);
            font-size: clamp(0.82rem, 2vw, 0.94rem);
            font-style: italic;
            font-weight: 300;
            letter-spacing: 0.08em;
            line-height: 2;
            white-space: pre-line;
        }

        .action-label {
            margin: 38px 0 14px;
            color: rgba(255, 255, 255, 0.32);
            font-family: var(--font-sans);
            font-size: 0.6rem;
            letter-spacing: 0.34em;
            text-transform: uppercase;
        }

        .resident-actions {
            display: grid;
            gap: 8px;
        }

        .platform-link,
        .platform-button {
            display: flex;
            min-height: 58px;
            padding: 0 18px;
            align-items: center;
            border: 1px solid var(--line);
            color: rgba(255, 255, 255, 0.78);
            background: rgba(255, 255, 255, 0.018);
            text-align: left;
            text-decoration: none;
            cursor: pointer;
            transition: border-color 260ms ease, color 260ms ease, background 260ms ease;
        }

        .platform-link:hover,
        .platform-link:focus-visible,
        .platform-button:hover,
        .platform-button:focus-visible {
            border-color: var(--line-strong);
            color: #fff;
            background: var(--accent-faint);
            outline: none;
        }

        .platform-name {
            font-size: 0.86rem;
            letter-spacing: 0.16em;
        }

        .no-entry {
            margin: 0;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.38);
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 0.14em;
            line-height: 1.8;
            text-align: center;
        }

        .pin-layer {
            z-index: 400;
            background: rgba(0, 0, 0, 0.84);
        }

        .pin-card {
            position: relative;
            width: min(430px, 100%);
            padding: clamp(30px, 7vw, 52px);
            border: 1px solid rgba(194, 184, 163, 0.32);
            background: rgba(8, 8, 8, 0.985);
            box-shadow: 0 32px 90px rgba(0, 0, 0, 0.78);
            transform: translateY(12px) scale(0.985);
            transition: transform 350ms var(--ease-cinema);
        }

        .pin-kicker {
            margin: 0 0 14px;
            color: rgba(194, 184, 163, 0.56);
            font-family: var(--font-sans);
            font-size: 0.6rem;
            letter-spacing: 0.34em;
        }

        .pin-title {
            margin: 0;
            color: var(--text-main);
            font-size: 1.55rem;
            font-weight: 500;
            letter-spacing: 0.14em;
        }

        .pin-copy {
            margin: 16px 0 26px;
            color: rgba(255, 255, 255, 0.46);
            font-size: 0.74rem;
            font-weight: 300;
            letter-spacing: 0.07em;
            line-height: 1.9;
        }

        .pin-label {
            display: block;
            margin-bottom: 10px;
            text-align: left;
        }

        .pin-input {
            width: 100%;
            height: 64px;
            padding: 0 14px 0 23px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 0;
            outline: 0;
            color: #fff;
            background: rgba(255, 255, 255, 0.025);
            font-family: var(--font-sans);
            font-size: 1.35rem;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.58em;
            text-align: center;
            transition: border-color 220ms ease, background 220ms ease;
        }

        .pin-input:focus {
            border-color: var(--line-strong);
            background: rgba(194, 184, 163, 0.05);
        }

        .pin-input:disabled {
            opacity: 0.34;
        }

        .pin-status {
            min-height: 24px;
            margin: 10px 0 14px;
            color: rgba(255, 255, 255, 0.46);
            font-family: var(--font-sans);
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            line-height: 1.7;
        }

        .pin-status.is-error {
            color: #c99f98;
        }

        .pin-status.is-locked {
            color: var(--accent-gold);
        }

        .pin-submit {
            width: 100%;
            min-height: 52px;
            border: 1px solid rgba(194, 184, 163, 0.36);
            color: var(--text-main);
            background: rgba(194, 184, 163, 0.1);
            font-family: var(--font-sans);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.3em;
            cursor: pointer;
            transition: border-color 220ms ease, background 220ms ease, color 220ms ease;
        }

        .pin-submit:hover,
        .pin-submit:focus-visible {
            border-color: var(--accent-gold);
            background: rgba(194, 184, 163, 0.17);
            outline: none;
        }

        .pin-submit:disabled {
            opacity: 0.32;
            cursor: default;
        }

        .site-footer {
            position: relative;
            z-index: 10;
            padding: 0 6vw 34px;
            color: rgba(255, 255, 255, 0.24);
            font-family: var(--font-sans);
            font-size: 0.56rem;
            letter-spacing: 0.28em;
            text-align: center;
        }

        @media (max-width: 720px) {
            .audio-controls {
                top: 16px;
                right: 18px;
            }

            .track-name {
                display: none;
            }

            .site-header {
                padding-top: 76px;
            }

            .eyebrow {
                letter-spacing: 0.32em;
            }

            .main-title {
                letter-spacing: 0.5em;
                text-indent: 0.5em;
            }

            .sub-title {
                letter-spacing: 0.18em;
            }

            .common-room-button {
                min-height: 46px;
                margin-top: 24px;
                padding-inline: 20px;
                letter-spacing: 0.22em;
            }

            .corridor {
                width: 100%;
            }

            .apartment-grid {
                height: min(66vh, 660px);
                min-height: 500px;
                gap: 8px;
                padding: 0 8vw;
                scroll-padding-inline: 8vw;
                scroll-snap-type: x mandatory;
            }

            .room,
            .room:hover,
            .room:focus-visible {
                flex: 0 0 82vw;
            }

            .room-bg,
            .room:hover .room-bg,
            .room:focus-visible .room-bg {
                filter: grayscale(16%) brightness(0.7) contrast(1.06);
                transform: scale(1.02);
            }

            .room-shade,
            .room:hover .room-shade,
            .room:focus-visible .room-shade {
                opacity: 0.9;
            }

            .room-number {
                top: 20px;
                writing-mode: horizontal-tb;
            }

            .room-content,
            .room:hover .room-content,
            .room:focus-visible .room-content {
                padding: 30px 24px;
                opacity: 1;
                transform: none;
            }

            .char-name {
                white-space: normal;
            }

            .corridor-nav {
                display: none;
            }

            .resident-modal,
            .pin-layer {
                padding: 14px;
                place-items: end center;
            }

            .resident-card,
            .pin-card {
                width: 100%;
                max-height: calc(100vh - 28px);
                overflow-y: auto;
            }

        }

        @media (hover: none) {
            .room-content {
                opacity: 1;
                transform: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="film-grain" aria-hidden="true"></div>

    <audio id="ambient-bgm" src="./bgm.mp3" preload="metadata" loop></audio>
    <div class="audio-controls">
        <span class="track-name">寓見 · ORIGINAL THEME</span>
        <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false" aria-label="播放寓見主題曲">
            <span class="sound-dot" aria-hidden="true"></span>
            <span id="sound-label">SOUND OFF</span>
        </button>
    </div>

    <header class="site-header">
        <p class="eyebrow">Meet U · Apartment 00</p>
        <h1 class="main-title">寓見</h1>
        <p class="sub-title">
            七個迥異的靈魂，<br>
            他們共用著這座公寓，各自又有那些故事。
        </p>
        <button class="common-room-button" id="common-room-button" type="button" aria-haspopup="dialog" aria-controls="resident-modal">
            寓見 MeetU
        </button>
    </header>

    <main class="corridor" aria-label="寓見住戶長廊">

                    { type: "gpts", url: "https://chatgpt.com/g/g-6a38222a3d6c81919d0f01b8796c7f5c-nan-shuo" },
                    { type: "gem" },

                ],

                    iv: "bS3zuprV0CiXF3+g",
                    cipher: "6EbUn2+IxMbUelJmt4qoizzpQOBf6YdzN6wJaEepkJz01ChsZJRnjBDXML5+ertkjZk1E5ko5z2visEpp7Rd2VABnm4w7Kf9K/t9XUtsLgaqqJ0m4P/Era51hg==",
                    iterations: 210000

        ];

        const platformMeta = {
            gpts: { name: "GPT" },
            gem: { name: "GEM" },
            heartbeat: { name: "Heartbeat" },
            threads: { name: "Threads" }
        };

        const commonRoomButton = document.getElementById("common-room-button");
        const grid = document.getElementById("apartment-grid");
        const modal = document.getElementById("resident-modal");
        const modalClose = document.getElementById("modal-close");
        const modalRoom = document.getElementById("modal-room");
        const modalName = document.getElementById("modal-name");
        const modalQuote = document.getElementById("modal-quote");
        const residentActions = document.getElementById("resident-actions");
        const pinLayer = document.getElementById("pin-layer");
        const pinClose = document.getElementById("pin-close");
        const pinTitle = document.getElementById("pin-title");
        const pinCopy = document.getElementById("pin-copy");
        const pinForm = document.getElementById("pin-form");
        const pinInput = document.getElementById("pin-input");
        const pinStatus = document.getElementById("pin-status");
        const pinSubmit = document.getElementById("pin-submit");
        const navPrev = document.getElementById("nav-prev");
        const navNext = document.getElementById("nav-next");
        const corridorNav = document.getElementById("corridor-nav");
        const bgm = document.getElementById("ambient-bgm");
        const soundToggle = document.getElementById("sound-toggle");
        const soundLabel = document.getElementById("sound-label");
        const lockStorageKey = "meetu-gem-locks-v1";

        let activeResident = null;
        let activeGem = null;
        let activeLockId = null;
        let lastFocusedElement = null;
        let lockTimer = null;
        let fallbackLockState = {};

        function buildRooms() {
            const fragment = document.createDocumentFragment();

            residents.forEach((resident) => {
                const room = document.createElement("article");
                room.className = "room";
                room.tabIndex = 0;
                room.setAttribute("role", "button");
                room.setAttribute("aria-label", `開啟 ${resident.room} ${resident.name} 的住戶選單`);
                room.dataset.residentId = resident.id;

                const image = document.createElement("img");
                image.className = "room-bg";
                image.src = resident.image;
                image.alt = "";
                image.loading = resident.id === "meguro" ? "eager" : "lazy";
                image.decoding = "async";
                image.style.objectPosition = resident.position;
                if (resident.hoverScale) {
                    image.style.setProperty("--room-hover-scale", resident.hoverScale);
                }
                if (resident.zoomOrigin) {
                    image.style.setProperty("--room-zoom-origin", resident.zoomOrigin);
                }

                const shade = document.createElement("div");
                shade.className = "room-shade";
                shade.setAttribute("aria-hidden", "true");

                const roomNumber = document.createElement("p");
                roomNumber.className = "room-number";
                roomNumber.textContent = resident.room;

                const content = document.createElement("div");
                content.className = "room-content";

                const name = document.createElement("h2");
                name.className = "char-name";
                name.textContent = resident.name;

                const quote = document.createElement("p");
                quote.className = "char-quote";
                quote.textContent = resident.quote;

                const hint = document.createElement("span");
                hint.className = "open-hint";
                hint.textContent = resident.entrances.length ? "Open resident menu" : "View resident";

                content.append(name, quote, hint);
                room.append(image, shade, roomNumber, content);
                room.addEventListener("click", () => openResident(resident));
                room.addEventListener("keydown", (event) => {
                    if (event.key === "Enter" || event.key === " ") {
                        event.preventDefault();
                        openResident(resident);
                    }
                });

                fragment.appendChild(room);
            });

            grid.appendChild(fragment);
        }

        function buildEntrance(entrance, resident) {
            const meta = platformMeta[entrance.type];
            const element = document.createElement(entrance.type === "gem" ? "button" : "a");
            element.className = entrance.type === "gem" ? "platform-button" : "platform-link";

            if (entrance.type === "gem") {
                element.type = "button";
                element.addEventListener("click", () => openPinGate(resident, entrance));
            } else {
                element.href = entrance.url;
                element.target = "_blank";
                element.rel = "noopener noreferrer";
            }

            const name = document.createElement("span");
            name.className = "platform-name";
            name.textContent = entrance.label || meta.name;

            element.append(name);
            return element;
        }

        function openResident(resident) {
            activeResident = resident;
            lastFocusedElement = document.activeElement;
            modalRoom.textContent = resident.modalKicker || resident.room;
            modalName.textContent = resident.modalTitle || resident.name;
            modalQuote.textContent = resident.quote;
            residentActions.replaceChildren();

            if (resident.entrances.length) {
                resident.entrances.forEach((entrance) => {
                    residentActions.appendChild(buildEntrance(entrance, resident));
                });
            } else {
                const noEntry = document.createElement("p");
                noEntry.className = "no-entry";
                noEntry.textContent = "本房目前尚未開放其他拜訪入口。";
                residentActions.appendChild(noEntry);
            }

            modal.hidden = false;
            document.body.classList.add("modal-open");
            requestAnimationFrame(() => {
                modal.classList.add("is-open");
                modalClose.focus();
            });
        }

        function closeResident() {
            modal.classList.remove("is-open");
            window.setTimeout(() => {
                modal.hidden = true;
                activeResident = null;
                if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
                    lastFocusedElement.focus();
                }
                if (pinLayer.hidden) document.body.classList.remove("modal-open");
            }, 260);
        }

        function openPinGate(resident, entrance) {
            const encryptedGem = entrance.gem || resident.gem;
            if (!encryptedGem) return;
            activeResident = resident;
            activeGem = encryptedGem;
            activeLockId = entrance.lockId || resident.id;
            pinTitle.textContent = `${resident.name}的門鎖`;
            pinCopy.textContent = `請輸入 ${resident.room} 通行碼，驗證後將另開新視窗。`;
            pinInput.value = "";
            pinStatus.textContent = "";
            pinStatus.className = "pin-status";
            pinLayer.hidden = false;
            requestAnimationFrame(() => {
                pinLayer.classList.add("is-open");
                renderLockState();
            });
        }

        function closePinGate() {
            clearInterval(lockTimer);
            pinLayer.classList.remove("is-open");
            window.setTimeout(() => {
                pinLayer.hidden = true;
                pinInput.value = "";
                activeGem = null;
                activeLockId = null;
                if (!modal.hidden) modalClose.focus();
            }, 260);
        }

        function readAllLockStates() {
            try {
                return JSON.parse(localStorage.getItem(lockStorageKey) || "{}") || {};
            } catch (error) {
                return fallbackLockState;
            }
        }

        function writeAllLockStates(states) {
            fallbackLockState = states;
            try {
                localStorage.setItem(lockStorageKey, JSON.stringify(states));
            } catch (error) {
                // Private browsing or disabled storage: the in-memory fallback still applies.
            }
        }

        function getLockState(id) {
            const states = readAllLockStates();
            const state = states[id] || { failures: 0, strikes: 0, lockedUntil: 0, lastFailureAt: 0 };
            if (state.lastFailureAt && Date.now() - state.lastFailureAt > 86400000) {
                return { failures: 0, strikes: 0, lockedUntil: 0, lastFailureAt: 0 };
            }
            return state;
        }

        function setLockState(id, state) {
            const states = readAllLockStates();
            states[id] = state;
            writeAllLockStates(states);
        }

        function clearLockState(id) {
            const states = readAllLockStates();
            delete states[id];
            writeAllLockStates(states);
        }

        function formatCountdown(milliseconds) {
            const seconds = Math.max(0, Math.ceil(milliseconds / 1000));
            return `00:${String(seconds).padStart(2, "0")}`;
        }

        function renderLockState() {
            clearInterval(lockTimer);
            if (!activeLockId) return;

            const update = () => {
                const state = getLockState(activeLockId);
                const remaining = state.lockedUntil - Date.now();

                if (remaining > 0) {
                    pinInput.disabled = true;
                    pinSubmit.disabled = true;
                    pinStatus.className = "pin-status is-locked";
                    pinStatus.textContent = `門鎖暫停回應，請於 ${formatCountdown(remaining)} 後再試。`;
                    return;
                }

                pinInput.disabled = false;
                pinSubmit.disabled = false;
                if (pinStatus.classList.contains("is-locked")) {
                    pinStatus.className = "pin-status";
                    pinStatus.textContent = "可以再次輸入通行碼。";
                }
                clearInterval(lockTimer);
                window.setTimeout(() => pinInput.focus(), 0);
            };

            update();
            lockTimer = window.setInterval(update, 250);
        }

        function base64ToBytes(value) {
            const binary = atob(value);
            const bytes = new Uint8Array(binary.length);
            for (let index = 0; index < binary.length; index += 1) {
                bytes[index] = binary.charCodeAt(index);
            }
            return bytes;
        }

        async function decryptGemUrl(pin, encrypted) {
            if (!window.crypto || !window.crypto.subtle) {
                throw new Error("此瀏覽器不支援門鎖所需的加密功能。");
            }

            const keyMaterial = await crypto.subtle.importKey(
                "raw",
                new TextEncoder().encode(pin),
                "PBKDF2",
                false,
                ["deriveKey"]
            );

            const key = await crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: base64ToBytes(encrypted.salt),
                    iterations: encrypted.iterations,
                    hash: "SHA-256"
                },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );

            const decrypted = await crypto.subtle.decrypt(
                {
                    name: "AES-GCM",
                    iv: base64ToBytes(encrypted.iv)
                },
                key,
                base64ToBytes(encrypted.cipher)
            );

            const value = new TextDecoder().decode(decrypted);
            const url = new URL(value);
            if (url.protocol !== "https:" || url.hostname !== "gemini.google.com" || !url.pathname.startsWith("/gem/")) {
                throw new Error("解密後的入口格式不正確。");
            }
            return url.href;
        }

        pinInput.addEventListener("input", () => {
            pinInput.value = pinInput.value.replace(/\D/g, "").slice(0, 32);
            if (pinStatus.classList.contains("is-error")) {
                pinStatus.className = "pin-status";
                pinStatus.textContent = "";
            }
        });

        pinForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            if (!activeResident || !activeGem || !activeLockId) return;

            const state = getLockState(activeLockId);
            if (state.lockedUntil > Date.now()) {
                renderLockState();
                return;
            }

            const pin = pinInput.value;
            if (!/^\d+$/.test(pin)) {
                pinStatus.className = "pin-status is-error";
                pinStatus.textContent = "請輸入數字通行碼。";
                pinInput.focus();
                return;
            }

            pinSubmit.disabled = true;
            pinStatus.className = "pin-status";
            pinStatus.textContent = "驗證中……";
            const popup = window.open("about:blank", "_blank");
            if (popup) popup.opener = null;

            try {
                const url = await decryptGemUrl(pin, activeGem);
                clearLockState(activeLockId);
                pinStatus.textContent = "門鎖已開啟。";
                pinInput.value = "";
                if (popup) {
                    popup.location.replace(url);
                } else {
                    window.location.assign(url);
                }
                window.setTimeout(closePinGate, 180);
            } catch (error) {
                if (popup) popup.close();
                const nextState = getLockState(activeLockId);
                nextState.failures += 1;
                nextState.lastFailureAt = Date.now();

                if (nextState.failures >= 5) {
                    nextState.failures = 0;
                    nextState.strikes += 1;
                    const lockSeconds = [30, 60, 90][Math.min(nextState.strikes - 1, 2)];
                    nextState.lockedUntil = Date.now() + lockSeconds * 1000;
                    setLockState(activeLockId, nextState);
                    pinInput.value = "";
                    renderLockState();
                } else {
                    setLockState(activeLockId, nextState);
                    const attemptsLeft = 5 - nextState.failures;
                    pinStatus.className = "pin-status is-error";
                    pinStatus.textContent = `通行碼不正確，還可嘗試 ${attemptsLeft} 次。`;
                    pinSubmit.disabled = false;
                    pinInput.select();
                }
            }
        });

        function keepFocusInside(event, container) {
            if (event.key !== "Tab") return;
            const focusable = Array.from(container.querySelectorAll("button:not(:disabled), a[href], input:not(:disabled)"));
            if (!focusable.length) return;
            const first = focusable[0];
            const last = focusable[focusable.length - 1];
            if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                first.focus();
            }
        }

        commonRoomButton.addEventListener("click", () => openResident(commonRoom));
        modalClose.addEventListener("click", closeResident);
        pinClose.addEventListener("click", closePinGate);
        modal.addEventListener("click", (event) => {
            if (event.target === modal) closeResident();
        });
        pinLayer.addEventListener("click", (event) => {
            if (event.target === pinLayer) closePinGate();
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                if (!pinLayer.hidden) closePinGate();
                else if (!modal.hidden) closeResident();
            }
            if (!pinLayer.hidden) keepFocusInside(event, pinLayer);
            else if (!modal.hidden) keepFocusInside(event, modal);
        });

        function updateCorridorNavigation() {
            const maxScroll = Math.max(0, grid.scrollWidth - grid.clientWidth);
            corridorNav.hidden = maxScroll < 4;
            navPrev.disabled = grid.scrollLeft <= 4;
            navNext.disabled = grid.scrollLeft >= maxScroll - 4;
        }

        navPrev.addEventListener("click", () => {
            grid.scrollBy({ left: -grid.clientWidth * 0.66, behavior: "smooth" });
        });

        navNext.addEventListener("click", () => {
            grid.scrollBy({ left: grid.clientWidth * 0.66, behavior: "smooth" });
        });

        grid.addEventListener("scroll", updateCorridorNavigation, { passive: true });
        window.addEventListener("resize", updateCorridorNavigation);

        bgm.volume = 0.36;
        soundToggle.addEventListener("click", async () => {
            try {
                if (bgm.paused) {
                    soundLabel.textContent = "LOADING";
                    await bgm.play();
                    soundToggle.setAttribute("aria-pressed", "true");
                    soundToggle.setAttribute("aria-label", "暫停寓見主題曲");
                    soundLabel.textContent = "SOUND ON";
                } else {
                    bgm.pause();
                    soundToggle.setAttribute("aria-pressed", "false");
                    soundToggle.setAttribute("aria-label", "播放寓見主題曲");
                    soundLabel.textContent = "SOUND OFF";
                }
            } catch (error) {
                soundToggle.setAttribute("aria-pressed", "false");
                soundLabel.textContent = "UNAVAILABLE";
                soundToggle.setAttribute("aria-label", "主題曲目前無法播放");
            }
        });

        buildRooms();
        requestAnimationFrame(updateCorridorNavigation);
    </script>
