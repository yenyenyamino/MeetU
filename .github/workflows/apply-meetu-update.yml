name: Apply MeetU Room 102 update

on:
  push:
    branches:
      - main
    paths:
      - ".meetu-update/**"
      - ".github/workflows/apply-meetu-update.yml"

permissions:
  contents: write

concurrency:
  group: meetu-room-102-update
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Room 102 and resident updates
        run: |
          sed -i 's/len(data) < 100_000/len(data) < 10_000/' .meetu-update/apply_update.py
          python3 .meetu-update/apply_update.py

      - name: Validate generated page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              'id="common-room-button"',
              'ROOM 102 · COMMON ROOM',
              '「太近了，請停在那裡就好。」',
              'fujiwara-rin-202608.jpg',
              'sill-202608.jpg',
              'nanshuo-202608.jpg',
              'lockId: "meetu-common-room"',
          ]
          missing = [value for value in required if value not in html]
          if missing:
              raise SystemExit(f"Missing expected updates: {missing}")
          if 'lockId: "meguro-meet-u"' in html or 'label: "Meet U · GPT"' in html:
              raise SystemExit("MeetU entrances still remain on Meguro")

          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline script found")
          with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as handle:
              handle.write("\n".join(scripts))
              script_path = handle.name
          subprocess.run(["node", "--check", script_path], check=True)
          PY
          git diff --check

      - name: Commit completed update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Room 102 common entrance and refresh residents"
          git push origin main
